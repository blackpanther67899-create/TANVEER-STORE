<header><h1>TANVEER STORE</h1><p>Premium Watches Karachi</p><p style="color:gold">https://shorturl.at/1oQr1</p></header>
<div class="container" id="list"></div>
<div class="owner"><h2 style="color:gold;">Owner Panel</h2><input id="n" placeholder="Name"><br><input id="pr" placeholder="Price" type="number"><br><input id="im" placeholder="Image Link"><br><input id="ps" placeholder="Password" type="password"><br><button class="btn" style="width:200px" onclick="addP()">Add Product</button></div>
<div class="qr"><h2 style="color:gold;">Scan & Visit</h2><img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://shorturl.at/1oQr1" style="border:6px solid gold;border-radius:20px;background:white;padding:5px;"><p>https://shorturl.at/1oQr1</p></div>
<script>
let defaults=[{name:"Golden Luxury Watch",price:5500,img:"https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=500"},{name:"Black Smart Watch",price:3500,img:"https://images.unsplash.com/photo-1579586337278-3befd40fd17a?w=500"},{name:"Silver Chain Watch",price:4000,img:"https://images.unsplash.com/photo-1548169874-53e85f753f1e?w=500"}];
let prods=defaults;try{let s=localStorage.getItem("tanveer_products");if(s){let p=JSON.parse(s);if(Array.isArray(p)&&p.length>0)prods=p}}catch(e){}
function show(){let h="";prods.forEach(p=>{let m=`Hello I want ${p.name} Rs.${p.price}`;let w=`https://wa.me/923001234567?text=${encodeURIComponent(m)}`;h+=`<div class="card"><img src="${p.img}"><h3 style="color:gold">${p.name}</h3><div class="price">Rs.${p.price}</div><a href="${w}" target="_blank"><button class="btn">Order on WhatsApp</button></a></div>`});document.getElementById("list").innerHTML=h}
function addP(){if(document.getElementById("ps").value!=="tanveer123"){alert("Wrong Password");return}let n=document.getElementById("n").value,pr=document.getElementById("pr").value,im=document.getElementById("im").value||"https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=500";if(!n||!pr){alert("Name Price likho");return}prods.push({name:n,price:pr,img:im});localStorage.setItem("tanveer_products",JSON.stringify(prods));show();alert("Added!")}
show();
</script></body></html>

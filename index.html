<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TANVEER STORE</title>
<style>
body{margin:0;font-family:Arial;background:#000;color:#fff}
header{background:#111;text-align:center;padding:25px;border-bottom:3px solid gold}
header h1{color:gold;margin:0;font-size:36px}
.container{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:#111;border:1px solid #444;border-radius:15px;padding:15px;text-align:center}
.card img{width:100%;height:220px;object-fit:cover;border-radius:10px;background:#222}
.price{color:#0f0;font-size:22px;margin:10px;font-weight:bold}
.btn{background:gold;color:#000;padding:12px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;width:100%}
.qr{text-align:center;background:#0a0a0a;padding:35px;border-top:3px solid gold;margin-top:20px}
.owner{text-align:center;padding:20px;border:2px dashed gold;margin:20px;border-radius:15px;background:#111}
input{padding:12px;margin:6px;width:80%;border-radius:8px;border:none}
a{color:gold;text-decoration:none}
</style>
</head>
<body>
<header>
<h1>TANVEER STORE</h1>
<p>Premium Watches & Smart Gadgets | Karachi Pakistan</p>
<p style="color:gold">Visit: https://shorturl.at/1oQr1</p>
</header>

<div class="container" id="list"></div>

<div class="owner">
<h2 style="color:gold;">Owner Panel - ADD NEW PRODUCT</h2>
<input id="n" placeholder="Product Name e.g. Black Watch"><br>
<input id="pr" placeholder="Price e.g. 3500" type="number"><br>
<input id="im" placeholder="Image Link (optional)"><br>
<input id="ps" placeholder="Password" type="password"><br>
<button class="btn" style="width:200px;margin-top:10px;" onclick="addP()">Add Product</button>
<p style="color:gray;font-size:12px;margin-top:10px;">Password: tanveer123</p>
</div>

<div class="qr">
<h2 style="color:gold;">📱 Scan & Visit Our Store</h2>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://shorturl.at/1oQr1" style="border:6px solid gold;border-radius:20px;background:white;padding:5px;">
<p style="font-size:22px;margin-top:15px;font-weight:bold;">https://shorturl.at/1oQr1</p>
<p style="color:gray;">Scan QR to open store directly</p>
</div>

<script>
// FIXED CODE - No more error
let defaults=[
{name:"Golden Luxury Watch",price:5500,img:"https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=500"},
{name:"Black Smart Watch",price:3500,img:"https://images.unsplash.com/photo-1579586337278-3befd40fd17a?w=500"},
{name:"Silver Chain Watch",price:4000,img:"https://images.unsplash.com/photo-1548169874-53e85f753f1e?w=500"}
];
let prods = defaults;
try{
  let saved = localStorage.getItem("tanveer_products");
  if(saved){ let parsed = JSON.parse(saved); if(Array.isArray(parsed) && parsed.length>0){ prods = parsed; } }
}catch(e){ prods = defaults; }

function show(){
  let h="";
  prods.forEach(p=>{
    let msg=`Hello Tanveer Store, I want ${p.name} Rs.${p.price}`;
    let wa=`https://wa.me/923001234567?text=${encodeURIComponent(msg)}`;
    h+=`<div class="card"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x200?text=Watch'"><h3 style="color:gold">${p.name}</h3><div class="price">Rs.${p.price}</div><a href="${wa}" target="_blank"><button class="btn">Order on WhatsApp</button></a></div>`;
  });
  document.getElementById("list").innerHTML=h;
}
function addP(){
  if(document.getElementById("ps").value!=="tanveer123"){alert("Wrong Password");return;}
  let n=document.getElementById("n").value, pr=document.getElementById("pr").value, im=document.getElementById("im").value||"https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=500";
  if(!n||!pr){alert("Name Price likho");return;}
  prods.push({name:n,price:pr,img:im});
  localStorage.setItem("tanveer_products",JSON.stringify(prods));
  show(); alert("Product Added!");
}
show();
</script>
</body>
</html>

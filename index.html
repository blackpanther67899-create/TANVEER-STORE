<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TANVEER STORE</title>
<style>
body{background:#0a0a0a;color:#fff;text-align:center;font-family:Arial;margin:0}
header{background:#111;padding:20px;border-bottom:3px solid #D4AF37}
h1{color:#D4AF37;margin:0}
.card{background:#151515;border:1px solid #333;border-radius:12px;padding:10px;margin:10px;display:inline-block;width:250px;vertical-align:top}
.card img{width:100%;height:190px;object-fit:cover;border-radius:8px;background:#222}
.price{color:#D4AF37;font-weight:bold}
.btn{background:#25D366;color:#fff;padding:8px 14px;border-radius:20px;border:none;cursor:pointer;margin:4px;font-weight:bold}
.btn2{background:#D4AF37;color:#000}
.box{max-width:480px;margin:20px auto;background:#111;padding:15px;border:2px dashed #D4AF37;border-radius:10px}
.box input{width:90%;padding:10px;margin:5px;border-radius:6px;border:none}
#pre{width:90%;height:180px;object-fit:cover;border-radius:8px;display:none;margin:10px auto;border:2px solid #D4AF37}
</style>
</head>
<body>
<header>
<h1>TANVEER STORE</h1>
<p>03164033509 | Karachi</p>
<button class="btn btn2" onclick="openBox()">🔐 Laptop Gallery Se Add Karo</button>
</header>
<h2 style="color:#D4AF37">Our Watches</h2>
<div id="show"></div>

<div id="ownerBox" class="box" style="display:none">
<h3 style="color:#D4AF37">Nayi Watch Add Karo</h3>
<input id="wName" placeholder="Watch Name Likho">
<input id="wPrice" placeholder="Price Likho" type="number">
<input type="file" id="wFile" accept="image/*" style="background:#222;color:#fff" onchange="showPre()">
<img id="pre">
<button class="btn btn2" style="width:92%;padding:12px" onclick="addWatch()">✅ ADD KARO</button>
<button class="btn" style="background:red;width:92%" onclick="closeBox()">Close</button>
</div>

<div style="margin:30px auto;background:#151515;padding:15px;border:1px solid #D4AF37;border-radius:10px;max-width:350px">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://blackpanther67899-create.github.io/TANVEER-STORE/" style="background:#fff;padding:6px;border-radius:6px">
<p><a href="https://wa.me/923164033509" style="color:#25D366">WhatsApp: 03164033509</a></p>
</div>

<script>
let def=[
{name:"Rolex Gold",price:4500,image:"https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=500"},
{name:"Smart Watch",price:3000,image:"https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500"},
{name:"Casio Black",price:2800,image:"https://images.unsplash.com/photo-1524805444973-bf390eab2a1d?w=500"}
];
let prods=JSON.parse(localStorage.getItem('tanveer_simple')||'null')||def;
let b64="";
function showPre(){
let f=document.getElementById('wFile').files[0];
if(!f)return;
let r=new FileReader();
r.onload=e=>{b64=e.target.result;let im=document.getElementById('pre');im.src=b64;im.style.display='block';};
r.readAsDataURL(f);
}
function showAll(){
let d=document.getElementById('show');d.innerHTML="";
prods.forEach((p,i)=>{
d.innerHTML+=`<div class="card"><img src="${p.image}"><h3>${p.name}</h3><div class="price">Rs.${p.price}</div><a class="btn" href="https://wa.me/923164033509?text=${encodeURIComponent(p.name)}">Order 03164033509</a><br><button class="btn" style="background:red;font-size:10px" onclick="del(${i})">Delete</button></div>`;
});
localStorage.setItem('tanveer_simple',JSON.stringify(prods));
}
function openBox(){let p=prompt("Password: 03164033509");if(p=="03164033509")document.getElementById('ownerBox').style.display='block';else alert("Wrong");}
function closeBox(){document.getElementById('ownerBox').style.display='none';}
function addWatch(){
let n=document.getElementById('wName').value.trim();
let pr=document.getElementById('wPrice').value.trim();
if(!n||!pr){alert("Name aur Price likho!");return;}
if(!b64){alert("Photo chuno!");return;}
prods.push({name:n,price:pr,image:b64});
showAll();b64="";document.getElementById('wName').value="";document.getElementById('wPrice').value="";document.getElementById('pre').style.display='none';alert("✅ Add Ho Gayi!");
closeBox();
}
function del(i){if(confirm("Delete?")){prods.splice(i,1);showAll();}}
showAll();
</script>
</body>
</html>
